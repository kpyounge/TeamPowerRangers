<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <!-- Apply whichever theme (light/dark) was last chosen, before the
         stylesheet below even renders, so the page doesn't "flash" the
         wrong theme for a moment. -->
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('habitStackerTheme') || 'dark'
        );
    </script>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <!-- Light / dark mode toggle -->
    <div class="theme-toggle-row">
        <span>Light / Dark Mode</span>
        <label class="theme-switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
    </div>
    <div class="container">
        <div class="header">
            <h1>Profile</h1>
            <div class="header-links">
                <a href="/dashboard">Back to Stacks</a>
                <button id="refreshButton">Refresh List</button>
                <button id="logoutButton">Log Out</button>
            </div>
        </div>

        

        <!-- Demonstrates calling a JWT-protected route (/api/users) from
             an internal page, with the token attached for authorization. -->
        <p>Registered accounts (protected route demo):</p>
        <div class="user-list" id="userList"></div>
    </div>

    <script src="/js/datamodel.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
