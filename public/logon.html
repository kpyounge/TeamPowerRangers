<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logon</title>
    <link rel="stylesheet" href="css/logon.css">
</head>

<body>
    <div class="container">
        <img src="images/habit stacker logo.png" alt="Habit Stacker Logo" class="login-logo">
        
    
    <div class="form-tabs">
        <button type="button" id="login-tab" class="tab active">Log In</button>
        <button type="button" id="create-account-tab" class="tab">Sign Up</button>
    </div>

    <div id="form-container">
        <!-- Logon Form -->
        <form id="logon-form" class="active-form">
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" placeholder="Enter your username" required>

            <label for="login-password">Password:</label>
            <input type="password" id="login-password" placeholder="Enter your password" required>

            <button type="submit" class="button">Log In</button>

            <button type="button" class="forgot-link" id="forgot-password-link">Forgot password?</button>
        </form>

        <!-- Create Account Form -->
        <form id="create-account-form">


        <div class="form-row">
            <div class="form-field">
                <label for="create-firstname">First Name</label>
                <input type="text" id="create-firstname" placeholder="First name" required>
        </div>
        <div class="form-field">
            <label for="create-lastname">Last Name</label>
            <input type="text" id="create-lastname" placeholder="Last name" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-field">
            <label for="create-username">Username</label>
            <input type="text" id="create-username" placeholder="Username" required>
        </div>
        <div class="form-field">
            <label for="create-birthday">Birthday (optional)</label>
            <input type="date" id="create-birthday">
        </div>
    </div>

    <div class="form-row">
        <div class="form-field">
            <label for="create-password">Password</label>
            <input type="password" id="create-password" placeholder="Password" required>
        </div>
        <div class="form-field">
            <label for="create-confirm-password">Confirm Password</label>
            <input type="password" id="create-confirm-password" placeholder="Confirm password" required>
        </div>
    </div>

    <button type="submit" class="button">Create Account</button>
    

</form>
          
        <!-- Forgot Password Form -->
        <form id="forgot-password-form">
            <div class="form-row">
                <div class="form-field">
                    <label for="forgot-username">Username</label>
                    <input type="text" id="forgot-username" placeholder="Username" required>
                </div>
                <div class="form-field">
                    <label for="forgot-birthday">Birthday</label>
                    <input type="date" id="forgot-birthday" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="forgot-firstname">First Name</label>
                    <input type="text" id="forgot-firstname" placeholder="First name" required>
                </div>
                <div class="form-field">
                    <label for="forgot-lastname">Last Name</label>
                    <input type="text" id="forgot-lastname" placeholder="Last name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="forgot-new-password">New Password</label>
                    <input type="password" id="forgot-new-password" placeholder="New password" required>
                </div>
                <div class="form-field">
                    <label for="forgot-confirm-password">Confirm New Password</label>
                    <input type="password" id="forgot-confirm-password" placeholder="Confirm new password" required>
                </div>
            </div>

            <button type="submit" class="button">Reset Password</button>
            <button type="button" class="forgot-link" id="back-to-login">Back to log in</button>
        </form>
    

            <p id="message" class="message"></p>
        </div>
    </div>

    <script src="js/logon.js"></script>
</body>

</html>
