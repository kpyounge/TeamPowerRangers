<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('habitStackerTheme') || 'dark'
        );
    </script>

    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
        <!-- Light / dark mode toggle -->
    <div class="theme-toggle-row">
        <span>Light / Dark Mode</span>
        <label class="theme-switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
    </div>

    <a href="dashboard.html" class="dashboard-link"> Return to Dashboard </a>

    <div class="profile-container">
        <img id="profilePicture" src="images/default-avatar.png" width="120" height="120" class="profile-picture">
        <h1 id="firstname"></h1>
        <p id="accountCreationDate" class="account-date">Account created: </p>
    </div>

    <div class="summary-container">
        <div class="stat-card">
            <h2 id="activeHabits">0</h2>
            <p>Active Habits</p>
        </div>

        <div class="stat-card">
            <h2 id="currentStreak">0</h2>
            <p>Day Streak</p>
        </div> 
    </div>

    <div class="actions">
        <button id="editProfileButton" type="button">
            Edit Profile
        </button>

        <button id="logoutButton" type="button">
            Log Out
        </button>
    </div>

    <dialog id="editProfileDialog">
        <form id="editProfileForm">
            <h2>Edit Profile</h2>
            <fieldset class="avatar-picker">
                <legend>Profile Picture</legend>
                <div id="profilePictureOptions" class="avatar-options"></div>
            </fieldset>
            
            <label for="usernameInput">Username</label>
            <input type="text" id="usernameInput" name="username" required>

            <label for="firstnameInput">First Name</label>
            <input type="text" id="firstnameInput" name="firstname" required>

            <label for="lastnameInput">Last Name</label>
            <input type="text" id="lastnameInput" name="lastname" required>

            <p id="editError" role="alert" hidden></p>

            <div class="dialog-actions">
                <button type="button" id="cancelEditButton">
                    Cancel
                </button>

                <button type="submit" id="saveEditButton">
                    Save Changes
                </button>
            </div>
        </form>
    </dialog>
    
    <script src="/js/datamodel.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
