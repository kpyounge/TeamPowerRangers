<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Stacks</title>
    <!-- Apply whichever theme (light/dark) was last chosen on the
         Profile page, before the stylesheet below even renders, so
         the page doesn't "flash" the wrong theme for a moment. -->
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('habitStackerTheme') || 'dark'
        );
    </script>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
      <!-- Light / dark mode toggle -->
      <div class="theme-toggle-row">
        <span>Light / Dark Mode</span>
        <label class="theme-switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
    </div>
    <div class="container">
        <div class="header">
            <h1>Habit Stacks</h1>
            <div class="header-links">
                <a href="profilepage.html">Profile</a>
                <button id="logoutButton">Log Out</button>
            </div>
        </div>

        <!-- Habit stacks are grouped by time of day. For Sprint 1 this is a
             static layout built from sample data in dashboard.js - no
             backend habit routes exist yet, so nothing here is saved. -->
        <div class="stacks-container" id="stacksContainer"></div>
    </div>

    <!-- Floating "add habit" button -->
    <button id="addHabitBtn" class="add-habit-btn" title="Add habit">+</button>

    <!-- "Input new habit" pop-up, per design guide -->
    <div id="habitModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Add a Habit</h2>

            <label for="habitNameInput">Habit name</label>
            <input type="text" id="habitNameInput" placeholder="e.g. Brush teeth">

            <label for="habitTimeInput">Time of day</label>
            <select id="habitTimeInput">
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
                <option value="night">Night</option>
            </select>

            <label for="habitStatusInput">Status</label>
            <select id="habitStatusInput">
                <option value="working_on">Working On (new habit)</option>
                <option value="current">Current (already cemented)</option>
            </select>

            <div class="modal-actions">
                <button id="modalCancelBtn">Cancel</button>
                <button id="modalSaveBtn">Save</button>
            </div>
        </div>
    </div>
    <!-- "Edit / delete habit" pop-up. Same layout as the add pop-up;
         dashboard.js fills it in with the habit that was clicked. -->
         <div id="editHabitModal" class="modal-overlay hidden">
            <div class="modal-box">
                <h2>Edit Habit</h2>
    
                <label for="editHabitNameInput">Habit name</label>
                <input type="text" id="editHabitNameInput">
    
                <label for="editHabitTimeInput">Stack</label>
                <select id="editHabitTimeInput">
                    <option value="morning">Morning</option>
                    <option value="afternoon">Afternoon</option>
                    <option value="evening">Evening</option>
                    <option value="night">Night</option>
                </select>
    
                <label for="editHabitStatusInput">Status</label>
                <select id="editHabitStatusInput">
                    <option value="working_on">Working On (new habit)</option>
                    <option value="current">Current (already cemented)</option>
                </select>
    
                <p id="editHabitError" class="modal-error" role="alert" hidden></p>
    
                <div class="modal-actions">
                    <button id="editCancelBtn">Cancel</button>
                    <button id="editSaveBtn">Save</button>
                </div>
    
                <button id="deleteHabitBtn" class="delete-habit-btn">Delete Habit</button>
            </div>
        </div>
        
    <script src="/js/datamodel.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
