<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Stacks</title>
    <!-- Apply whichever theme (light/dark) was last chosen on the
         Profile page, before the stylesheet below even renders, so
         the page doesn't "flash" the wrong theme for a moment. -->
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('habitStackerTheme') || 'dark'
        );
    </script>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
      
    <div class="container">
        <div class="header">
    <h1>Habit Stacks</h1>

    <div class="header-links">
        <button id="addStackBtn" class="add-stack-btn">+ Stack</button>
        <a href="profilepage.html">Profile</a>
        <button id="logoutButton">Log Out</button>
     </div>
    </div>

        <!-- Custom habit stacks created by the user are rendered here. -->
        <div class="stacks-container" id="stacksContainer"></div>
    </div>
    <!-- Create a new custom stack -->
    <div id="stackModal" class="modal-overlay hidden">
     <div class="modal-box">
            <h2>Create a Stack</h2>

         <label for="stackNameInput">Stack name</label>
         <input
            type="text"
            id="stackNameInput"
            placeholder="e.g. Morning Routine"
            maxlength="100"
         >
        <label>Stack color</label>

<div class="stack-color-picker">
    <button
        type="button"
        class="stack-color-option cyan"
        data-color="cyan"
        aria-label="Cyan"
    ></button>

    <button
        type="button"
        class="stack-color-option pink"
        data-color="pink"
        aria-label="Pink"
    ></button>

    <button
        type="button"
        class="stack-color-option purple"
        data-color="purple"
        aria-label="Purple"
    ></button>

    <button
        type="button"
        class="stack-color-option orange"
        data-color="orange"
        aria-label="Orange"
    ></button>

    <button
        type="button"
        class="stack-color-option green selected"
        data-color="green"
        aria-label="Green"
    ></button>
</div>
        <div class="modal-actions">
            <button id="stackCancelBtn">Cancel</button>
            <button id="stackSaveBtn">Save</button>
          </div>
               </div>
    </div>

    <!-- Delete Stack Modal -->
<div id="deleteStackModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Delete Stack?</h2>

        <p id="deleteStackMessage"></p>

        <div id="deleteStackWarning" class="delete-stack-warning" hidden>
            <strong id="deleteStackWarningTitle"></strong>
            <p>
                Deleting this stack will also permanently delete
                all habits inside it.
            </p>
        </div>

        <p class="delete-stack-undo">
            This action can't be undone.
        </p>

        <div class="modal-actions">
            <button type="button" id="deleteStackCancelBtn">
                Cancel
            </button>

            <button type="button" id="deleteStackConfirmBtn">
                Delete Stack
            </button>
        </div>
    </div>
</div>

    <!-- Floating "add habit" button -->

    <button id="addHabitBtn" class="add-habit-btn" title="Add habit">+</button>
   
    <!-- Rename Stack Modal -->
<div id="renameStackModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Rename Stack</h2>

        <label for="renameStackInput">Stack name</label>
        <input
            type="text"
            id="renameStackInput"
            maxlength="100"
            placeholder="Enter stack name"
        >

        <div class="modal-actions">
            <button type="button" id="renameStackCancelBtn">
                Cancel
            </button>

            <button type="button" id="renameStackSaveBtn">
                Save
            </button>
        </div>
    </div>
</div>

<!-- Change Stack Color Modal -->
<div id="changeStackColorModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Change Stack Color</h2>

        <label>Stack color</label>

        <div class="stack-color-picker" id="editStackColorPicker">
            <button
                type="button"
                class="edit-stack-color-option stack-color-option cyan"
                data-color="cyan"
                aria-label="Cyan"
            ></button>

            <button
                type="button"
                class="edit-stack-color-option stack-color-option pink"
                data-color="pink"
                aria-label="Pink"
            ></button>

            <button
                type="button"
                class="edit-stack-color-option stack-color-option purple"
                data-color="purple"
                aria-label="Purple"
            ></button>

            <button
                type="button"
                class="edit-stack-color-option stack-color-option orange"
                data-color="orange"
                aria-label="Orange"
            ></button>

            <button
                type="button"
                class="edit-stack-color-option stack-color-option green"
                data-color="green"
                aria-label="Green"
            ></button>
        </div>

        <div class="modal-actions">
            <button type="button" id="changeStackColorCancelBtn">
                Cancel
            </button>

            <button type="button" id="changeStackColorSaveBtn">
                Save
            </button>
        </div>
    </div>
</div>


    <!-- "Input new habit" pop-up, per design guide -->
    <div id="habitModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Add a Habit</h2>

            <label for="habitNameInput">Habit name</label>
            <input type="text" id="habitNameInput" placeholder="e.g. Brush teeth">

            <label for="habitStackInput">Stack</label>
            <select id="habitStackInput">
                <option value="">Choose a stack</option>
            </select>

            <label for="habitStatusInput">Status</label>
            <select id="habitStatusInput">
                <option value="working_on">Working On (new habit)</option>
                <option value="current">Current (already cemented)</option>
            </select>

            <div class="modal-actions">
                <button id="modalCancelBtn">Cancel</button>
                <button id="modalSaveBtn">Save</button>
            </div>
        </div>
    </div>
    <!-- "Edit / delete habit" pop-up. Same layout as the add pop-up;
         dashboard.js fills it in with the habit that was clicked. -->
         <div id="editHabitModal" class="modal-overlay hidden">
            <div class="modal-box">
                <h2>Edit Habit</h2>
    
                <label for="editHabitNameInput">Habit name</label>
                <input type="text" id="editHabitNameInput">
    
                <label for="editHabitStackInput">Stack</label>
                <select id="editHabitStackInput">
                     <option value="">Choose a stack</option>
                </select>

                <label for="editHabitStatusInput">Status</label>
                <select id="editHabitStatusInput">
                    <option value="working_on">Working On (new habit)</option>
                    <option value="current">Current (already cemented)</option>
                </select>
    
                <p id="editHabitError" class="modal-error" role="alert" hidden></p>
    
                <div class="modal-actions">
                    <button id="editCancelBtn">Cancel</button>
                    <button id="editSaveBtn">Save</button>
                </div>
    
                <button id="deleteHabitBtn" class="delete-habit-btn">Delete Habit</button>
            </div>
        </div>
        <!-- Delete Habit Modal -->
<!-- Delete Habit Modal -->
<div id="deleteHabitModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Delete Habit?</h2>

        <div class="delete-stack-warning">
            <strong id="deleteHabitMessage"></strong>
        </div>

        <p class="delete-stack-undo">
            This action can't be undone.
        </p>

        <div class="modal-actions">
            <button type="button" id="deleteHabitCancelBtn">
                Cancel
            </button>

            <button type="button" id="deleteHabitConfirmBtn">
                Delete Habit
            </button>
        </div>
    </div>
</div>
        <!-- Bottom navigation bar: Dashboard (this page) and Progress -->
    <nav class="bottom-nav" aria-label="Main">
        <a href="/dashboard" class="nav-tab active" aria-current="page">
            <span class="nav-icon" aria-hidden="true">&#128203;</span>
            <span>Dashboard</span>
        </a>
        <a href="/progress.html" class="nav-tab">
            <span class="nav-icon" aria-hidden="true">&#128200;</span>
            <span>Progress</span>
        </a>
    </nav>    
        
    <script src="/js/datamodel.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/tutorial.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
